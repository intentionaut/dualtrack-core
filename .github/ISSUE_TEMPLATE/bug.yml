name: Bug
description: Something in Dualtrack does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste keys, tokens, customer data or home paths. For a security problem, do not use this form: see SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Kit version
      description: Run `python3 <kit>/scripts/about.py` and paste the first line.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command run
      description: The exact command, or the step in the daily loop.
      render: sh
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happens instead
      description: The shortest output that shows it, with secrets removed.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: System
      description: The second line from `python3 <kit>/scripts/about.py`.
