# Untested example: not yet run in Actions. Any scheduler can run the loop instead: see the README.
# Disabled until setup. To turn it on, copy the kit to team-kit/, commit it and your
# profile, add product-context/ to .gitignore, run `claude setup-token` and add the
# result as the repository secret CLAUDE_CODE_OAUTH_TOKEN, add any steps your tests need, then uncomment the schedule and set the time.
# The context folder lives in the Actions cache. Each run's morning brief is an artifact.
name: daily change
on:
  workflow_dispatch:
    inputs:
      bet:
        description: Title of the bet to confirm before this run
        required: false
  # schedule:
  #   - cron: "0 6 * * *"
permissions:
  contents: write
  pull-requests: write
  actions: read  # to find the last completed run's id for the cache key
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false  # else the token sits in .git/config, where agents can read it
      # git asks gh for the token at push time; agents run with GH_TOKEN unset, so they get none
      - run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm install -g @anthropic-ai/claude-code@2.1.323
      # Branch code runs in bubblewrap here; Ubuntu 24.04 blocks the user namespaces it needs unless this is relaxed.
      - run: sudo apt-get install -y -q bubblewrap && sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: git config user.name "product team" && git config user.email "product-team@users.noreply.github.com"
      # Restore exactly the last completed run's cache, never a prefix match: a prefix would pick up whichever earlier
      # entry was saved last, so one poisoned entry could carry forward. A miss on the first run is fine.
      - id: prev
        run: echo "id=$(gh run list --workflow daily.yml --status completed --limit 1 --json databaseId --jq '.[0].databaseId // "none"')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: product-context
          key: team-context-${{ steps.prev.outputs.id }}
      - if: inputs.bet != ''
        run: mkdir -p product-context && python3 team-kit/scripts/loop_lib.py confirm product-context/bets.md "$BET"
        env:
          BET: ${{ inputs.bet }}
      - run: bash team-kit/scripts/daily_loop.sh profile.md
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: product-context
          key: team-context-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: morning-brief
          path: product-context/morning.md
